<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus - Alert & Route System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    :root {
      --bg-dark: #0a0a0f;
      --panel-bg: rgba(20, 22, 35, 0.65);
      --panel-border: rgba(100, 120, 255, 0.2);
      --text-main: #f0f4ff;
      --text-muted: #8a96b5;
      --accent: #4d7cff;
      --accent-glow: rgba(77, 124, 255, 0.4);
      --alert-critical: #ff3366;
      --alert-warning: #ffb833;
      --alert-info: #33ccff;
      --success: #00e699;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(77, 124, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 51, 102, 0.05), transparent 25%);
    }

    /* Navbar */
    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      z-index: 1000;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), #8a2be2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .logo-text span {
      color: var(--accent);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 230, 153, 0.1);
      border: 1px solid rgba(0, 230, 153, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
      font-family: 'Space Mono', monospace;
      color: var(--success);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 230, 153, 0.7);
      }

      70% {
        box-shadow: 0 0 0 6px rgba(0, 230, 153, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 230, 153, 0);
      }
    }

    /* Main Container */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
    }

    /* Sidebar - Alerts */
    .sidebar {
      width: 380px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--panel-border);
    }

    .sidebar-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .alert-filter {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .alerts-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .alerts-container::-webkit-scrollbar {
      width: 6px;
    }

    .alerts-container::-webkit-scrollbar-thumb {
      background: var(--panel-border);
      border-radius: 3px;
    }

    .alert-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 1.2rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .alert-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .alert-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--alert-color, var(--accent));
    }

    .alert-card.critical {
      --alert-color: var(--alert-critical);
    }

    .alert-card.warning {
      --alert-color: var(--alert-warning);
    }

    .alert-card.info {
      --alert-color: var(--alert-info);
    }

    .alert-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .alert-type {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--alert-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .alert-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .alert-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .alert-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .alert-action {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: 0.2s;
    }

    .alert-action:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Map Area */
    .map-container {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #0d111a;
    }

    /* Leaflet Dark Theme Overrides */
    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }

    /* Routing Panel Overrides */
    .leaflet-routing-container {
      background-color: var(--panel-bg) !important;
      backdrop-filter: blur(10px);
      border: 1px solid var(--panel-border) !important;
      color: var(--text-main) !important;
      border-radius: 12px !important;
      padding: 10px !important;
      max-height: 60vh;
      overflow-y: auto;
    }

    .leaflet-routing-container::-webkit-scrollbar {
      width: 4px;
    }

    .leaflet-routing-container::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 2px;
    }

    .leaflet-routing-alt,
    .leaflet-routing-geocoders {
      border-bottom: 1px solid var(--panel-border) !important;
    }

    .leaflet-routing-geocoder input {
      background: rgba(0, 0, 0, 0.3) !important;
      border: 1px solid var(--panel-border) !important;
      color: white !important;
      border-radius: 4px;
      padding: 6px !important;
    }

    /* Custom Floating Route Box */
    .route-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(15, 18, 28, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 1.5rem;
      width: 320px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    .route-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group {
      margin-bottom: 1rem;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .route-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #335cff);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
    }

    .route-btn:hover {
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Danger Zones on Map */
    .danger-zone-polygon {
      fill: var(--alert-critical);
      fill-opacity: 0.3;
      stroke: var(--alert-critical);
      stroke-width: 2;
      stroke-dasharray: 5, 5;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade {
      animation: fadeIn 0.4s ease forwards;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-container">
      <div class="logo-icon">N</div>
      <div class="logo-text">Nexus<span>Guard</span></div>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      SYSTEM ACTIVE
    </div>
  </header>

  <div class="main-container">
    <!-- Sidebar / Alerts -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>Active Alerts</span>
          <span
            style="font-size: 0.8rem; background: var(--alert-critical); padding: 2px 8px; border-radius: 12px; color: white;">3
            New</span>
        </div>
        <div class="alert-filter">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Critical</button>
          <button class="filter-btn">Weather</button>
          <button class="filter-btn">Traffic</button>
        </div>
      </div>

      <div class="alerts-container" id="alertsList">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Map & Routing -->
    <div class="map-container">
      <!-- Custom Route Input Panel -->
      <div class="route-panel">
        <h3>📍 Emergency Routing</h3>
        <div class="input-group">
          <label>Starting Point</label>
          <input type="text" id="startInput" placeholder="Enter starting location..." value="San Francisco, CA">
        </div>
        <div class="input-group">
          <label>Destination</label>
          <input type="text" id="endInput" placeholder="Enter destination..." value="San Jose, CA">
        </div>
        <button class="route-btn" id="calculateRouteBtn">Calculate Safe Route</button>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <script>
    // --- Mock Alert Data ---
    const alerts = [
      {
        id: 1,
        type: 'critical',
        category: 'FLOOD WARNING',
        time: 'Just now',
        title: 'Flash Flood on Highway 101',
        desc: 'Severe waterlogging reported. Road is impassable. Divert traffic immediately to higher ground routes.',
        coords: [37.562, -122.325]
      },
      {
        id: 2,
        type: 'warning',
        category: 'ROADBLOCK',
        time: '15m ago',
        title: 'Landslide Debris',
        desc: 'Minor debris affecting two lanes. Proceed with caution. Speed limits reduced.',
        coords: [37.422, -122.185]
      },
      {
        id: 3,
        type: 'info',
        category: 'WEATHER',
        time: '1h ago',
        title: 'Heavy Rain Advisory',
        desc: 'Expect decreased visibility and slippery roads in the bay area for the next 4 hours.',
        coords: null
      }
    ];

    // --- Render Alerts ---
    const alertsList = document.getElementById('alertsList');

    function renderAlerts() {
      alertsList.innerHTML = '';
      alerts.forEach((alert, index) => {
        const icon = alert.type === 'critical' ? '🚨' : alert.type === 'warning' ? '⚠️' : 'ℹ️';

        const card = document.createElement('div');
        card.className = `alert-card ${alert.type} animate-fade`;
        card.style.animationDelay = `${index * 0.1}s`;

        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-type">${icon} ${alert.category}</div>
            <div class="alert-time">${alert.time}</div>
          </div>
          <div class="alert-title">${alert.title}</div>
          <div class="alert-desc">${alert.desc}</div>
          ${alert.coords ? `<button class="alert-action" onclick="focusMap(${alert.coords[0]}, ${alert.coords[1]})">View on Map</button>` : ''}
        `;

        alertsList.appendChild(card);
      });
    }

    renderAlerts();

    // --- Map Initialization ---
    // Start at Bay Area
    const map = L.map('map', {
      zoomControl: false // Custom placement later
    }).setView([37.5, -122.2], 10);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Modern styled map tiles (CartoDB Dark Matter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Add Risk Zones (Mock polygons)
    const riskZoneCoordinates = [
      [37.58, -122.35],
      [37.55, -122.30],
      [37.52, -122.34],
      [37.56, -122.38]
    ];

    const riskZone = L.polygon(riskZoneCoordinates, {
      color: '#ff3366',
      fillColor: '#ff3366',
      fillOpacity: 0.2,
      dashArray: '5, 5'
    }).addTo(map);

    riskZone.bindPopup("<b style='color:#ff3366'>High Flood Risk Area</b><br>Try to avoid routing through this zone.");

    // --- Routing Machine Configuration ---
    // Note: We use OSRM demo server for hackathon purposes. In production, use your own routing server.
    let routingControl = null;

    function calculateRoute() {
      // Mock coordinates for SF to SJ for demo
      // In a real app, you would use a geocoder (like Nominatim API) to convert text input to lat/lng

      let start = L.latLng(37.7749, -122.4194); // SF
      let end = L.latLng(37.3382, -121.8863);   // SJ

      if (routingControl) {
        map.removeControl(routingControl);
      }

      routingControl = L.Routing.control({
        waypoints: [start, end],
        routeWhileDragging: true,
        lineOptions: {
          styles: [{ color: '#4d7cff', opacity: 0.8, weight: 6 }]
        },
        createMarker: function (i, waypoint, n) {
          const markerIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div style="background-color: ${i === 0 ? '#00e699' : '#ff3366'}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7]
          });
          return L.marker(waypoint.latLng, { icon: markerIcon });
        },
        showAlternatives: true,
        altLineOptions: {
          styles: [{ color: '#ffb833', opacity: 0.6, weight: 4 }]
        }
      }).addTo(map);
    }

    document.getElementById('calculateRouteBtn').addEventListener('click', calculateRoute);

    // Initial default route calculation
    setTimeout(calculateRoute, 1000);

    // Function to pan to alert location
    window.focusMap = function (lat, lng) {
      map.setView([lat, lng], 14, { animate: true, duration: 1.5 });
      L.popup()
        .setLatLng([lat, lng])
        .setContent('<b style="color:#ff3366">Incident Location</b>')
        .openOn(map);
    };

  </script>
</body>

</html>
